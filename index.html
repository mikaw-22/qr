<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=content_copy,download,settings" />    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <title>QR-Code Generator</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" href="assets/media/icon.svg">
</head>
<body>

    <div class="side-and-main">
        <div class="sidebar">
            <div class="sidebar-standalone" id="test">
                <div>
                    <u>Einstellungen:</u>
                </div>
                <div class="optionen-inputs">
                    <div class="inner-optionen">
                        <span>Länge:</span><input id="laenge" type="text" placeholder="2.2cm" inputmode="decimal">
                    </div>
                    <div class="inner-optionen">
                        <span>Breite:</span><input id="breite" type="text" placeholder="2.2cm" inputmode="decimal">
                    </div>
                    <div class="inner-optionen">
                        <span>QR-Farbe:</span><input id="qr-color" type="color" value="#000000">
                    </div>
                    <div class="inner-optionen">
                        <span>Hintergrund:</span><input id="bg-color" type="color" value="#ffffff">
                    </div>
                </div>
                <div class="btn-cont">
                    <button class="reset-btn" id="reset-size">Zurücksetzen</button>
                </div>
            </div>
        </div>
        <div class="main-cont">
            <div class="header">
                <p>QR-Code Generator:</p>
            </div>

            <div class="link-row">
                <input class="link-input" id="link-input" type="text" placeholder="Link eingeben …">
            </div>

            <div class="qr-result" id="qr-result">
                <div class="qr-stage">
                    <div id="qrcode"></div>
                </div>
            
                <div class="actions">
                    <button class="action-btn" id="copy-qr-btn" disabled>
                        <span class="material-symbols-outlined">content_copy</span>
                        QR-Code kopieren
                    </button>
                    <button class="action-btn" id="download-btn" disabled>
                        <span class="material-symbols-outlined">download</span>
                        QR-Code herunterladen
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <button class="settings-toggle" id="settings-toggle" title="Einstellungen">
        <span class="material-symbols-outlined">settings</span>
    </button>

    <script src="assets/js/script.js"></script>
</body>
</html>
